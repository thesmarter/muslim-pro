name: muslim
description: muslim-pro start kit app.

publish_to: "none"

version: 3.3.1+37

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0 <4.0.0"

dependencies:
  adhan: ^2.0.0+1
  archive: ^4.1.0
  audio_session: ^0.2.4
  audioplayers: ^6.8.1
  auto_size_text: ^3.0.0
  bloc: ^9.2.1
  bot_toast: ^4.1.3
  capture_widget:
    path: packages/capture_widget
  day_night_time_picker: ^1.3.1
  easy_debounce: ^2.0.3
  equatable: ^2.1.0
  file_picker: ^12.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_email_sender: ^10.0.1
  flutter_expandable_fab: ^2.5.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_slidable: ^4.0.3
  flutter_timezone: ^5.1.0
  flutter_zoom_drawer: ^3.2.0
  fluttertoast: ^10.0.0
  gal: ^2.3.3
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  get_it: ^9.2.1
  get_storage: ^2.1.1
  hijri: ^3.0.0
  http: ^1.6.0
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.2
  just_audio: ^0.10.6
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  persistent_bottom_nav_bar_v2: ^6.4.0
  quran_library: ^4.2.1
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  showcaseview: ^5.0.2
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  vibration: ^3.2.0
  wakelock_plus: ^1.7.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  mocktail: ^1.0.4

flutter_native_splash:
  android: true
  ios: true
  web: true
  color: "#303030"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/sounds/azkar/
    - assets/sounds/azhan/
    - assets/db/

  fonts:
    - family: Uthmanic
